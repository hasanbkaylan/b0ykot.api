<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>b0ykot.api</title>
  <style>
    :root {
      --md-surface: #faf8ff;
      --md-surface-container: #f0eff7;
      --md-surface-container-high: #e6e4ee;
      --md-on-surface: #1a1b21;
      --md-on-surface-variant: #45464f;
      --md-outline: #767680;
      --md-outline-variant: #c6c5d0;
      --md-primary: #3b5ba9;
      --md-on-primary: #ffffff;
      --md-primary-container: #dae2ff;
      --md-on-primary-container: #001848;
      --md-boykot-bg: #ffdad6;
      --md-boykot-text: #93000a;
      --md-degil-bg: #c4eed0;
      --md-degil-text: #0f5223;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --md-surface: #121318;
        --md-surface-container: #1e1f26;
        --md-surface-container-high: #292a32;
        --md-on-surface: #e3e2e9;
        --md-on-surface-variant: #c6c5d0;
        --md-outline: #90909a;
        --md-outline-variant: #45464f;
        --md-primary: #b2c5ff;
        --md-on-primary: #002b73;
        --md-primary-container: #20428f;
        --md-on-primary-container: #dae2ff;
        --md-boykot-bg: #5c1916;
        --md-boykot-text: #ffdad6;
        --md-degil-bg: #123e20;
        --md-degil-text: #c4eed0;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background-color: var(--md-surface);
      color: var(--md-on-surface);
      line-height: 1.5;
      padding: 16px;
      -webkit-tap-highlight-color: transparent;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding-bottom: 40px;
    }

    /* Top Bar */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 4px;
    }

    .brand-title {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .gh-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 9999px;
      background: var(--md-surface-container-high);
      color: var(--md-on-surface);
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 500;
      transition: opacity 0.2s;
    }
    .gh-btn:active { opacity: 0.75; }

    /* Hero Card */
    .hero-card {
      background: var(--md-surface-container);
      border-radius: 28px;
      padding: 24px;
    }

    .hero-card p {
      color: var(--md-on-surface-variant);
      font-size: 0.95rem;
      margin-bottom: 16px;
    }

    .stats-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .chip-boykot { background: var(--md-boykot-bg); color: var(--md-boykot-text); }
    .chip-degil { background: var(--md-degil-bg); color: var(--md-degil-text); }

    /* MD3 Search Bar */
    .search-box {
      position: relative;
      display: flex;
      align-items: center;
      background: var(--md-surface-container-high);
      border-radius: 9999px;
      padding: 4px 18px;
      height: 56px;
      transition: box-shadow 0.2s;
    }
    .search-box:focus-within {
      box-shadow: 0 0 0 2px var(--md-primary);
    }
    .search-icon {
      color: var(--md-on-surface-variant);
      flex-shrink: 0;
      margin-right: 12px;
    }
    .search-box input {
      width: 100%;
      border: none;
      background: transparent;
      color: var(--md-on-surface);
      font-size: 1rem;
      outline: none;
    }
    .search-box input::placeholder { color: var(--md-on-surface-variant); }

    .clear-btn {
      display: none;
      background: none;
      border: none;
      color: var(--md-on-surface-variant);
      cursor: pointer;
      padding: 6px;
      border-radius: 50%;
    }

    /* Search Results */
    #results {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .result-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 18px;
      border-radius: 20px;
      background: var(--md-surface-container);
    }
    .result-name { font-weight: 600; font-size: 1rem; }
    .badge {
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .badge-boykot { background: var(--md-boykot-bg); color: var(--md-boykot-text); }
    .badge-degil { background: var(--md-degil-bg); color: var(--md-degil-text); }

    .empty-msg {
      text-align: center;
      padding: 16px;
      color: var(--md-on-surface-variant);
      font-size: 0.9rem;
      background: var(--md-surface-container);
      border-radius: 20px;
    }

    /* Section Title */
    .section-title {
      font-size: 1.1rem;
      font-weight: 600;
      padding: 0 4px;
      margin-top: 4px;
    }

    /* Endpoint List Card */
    .endpoint-list {
      background: var(--md-surface-container);
      border-radius: 24px;
      overflow: hidden;
    }

    .endpoint-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--md-outline-variant);
    }
    .endpoint-item:last-child { border-bottom: none; }

    .endpoint-info { min-width: 0; }
    .endpoint-path {
      display: inline-block;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--md-primary);
      text-decoration: none;
      word-break: break-all;
    }
    .endpoint-desc {
      font-size: 0.85rem;
      color: var(--md-on-surface-variant);
      margin-top: 2px;
    }

    .copy-btn {
      flex-shrink: 0;
      border: none;
      background: var(--md-primary-container);
      color: var(--md-on-primary-container);
      padding: 8px 14px;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .copy-btn:active { transform: scale(0.95); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand-title">b0ykot.api</div>
      <a class="gh-btn" href="https://github.com/hasanbkaylan/b0ykot.api" target="_blank" rel="noopener">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
        </svg>
        GitHub
      </a>
    </header>

    <section class="hero-card">
      <p>Açık kaynaklı boykot ve alternatif marka listesi API'si. Uygulamalar için limitsiz JSON/TXT uç noktaları sunar.</p>
      <div class="stats-row">
        <span class="chip chip-boykot">Boykot: <span id="count-boykot">...</span></span>
        <span class="chip chip-degil">Boykot Değil: <span id="count-degil">...</span></span>
      </div>
    </section>

    <!-- Canlı Marka Arama -->
    <div class="search-box">
      <svg class="search-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
      </svg>
      <input id="search-input" type="text" placeholder="Marka ara (örn. Nestlé, Eti, Burger King)..." autocomplete="off" />
      <button id="clear-btn" class="clear-btn" aria-label="Temizle">✕</button>
    </div>

    <div id="results"></div>

    <h2 class="section-title">API Endpointleri</h2>
    <div class="endpoint-list" id="endpoints"></div>
  </div>

  <script>
    const ENDPOINTS = [
      { path: "/v1/all.json", desc: "Tüm listeler ve güncelleme tarihi (JSON)" },
      { path: "/v1/lookup.json", desc: "Normalize edilmiş hızlı sorgu sözlüğü (JSON)" },
      { path: "/v1/boykot.json", desc: "Sadece boykot markaları (JSON)" },
      { path: "/v1/boykotdegil.json", desc: "Boykot olmayan markalar (JSON)" },
      { path: "/boykot.txt", desc: "Orijinal boykot listesi (TXT)" },
      { path: "/boykotdegil.txt", desc: "Orijinal boykot değil listesi (TXT)" },
      { path: "/v1/boykot-variants.txt", desc: "Yazım varyasyonlu boykot listesi (TXT)" }
    ];

    const normalize = (text) =>
      text
        .replace(/İ/g, "i")
        .replace(/I/g, "i")
        .replace(/ı/g, "i")
        .toLowerCase()
        .normalize("NFKD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9]/g, "");

    const baseUrl = window.location.origin + window.location.pathname.replace(/\/$/, "");
    const endpointsEl = document.getElementById("endpoints");

    ENDPOINTS.forEach((ep) => {
      const fullUrl = baseUrl + ep.path;
      const item = document.createElement("div");
      item.className = "endpoint-item";
      item.innerHTML = `
        <div class="endpoint-info">
          <a class="endpoint-path" href=".${ep.path}" target="_blank">${ep.path}</a>
          <div class="endpoint-desc">${ep.desc}</div>
        </div>
        <button class="copy-btn" type="button">Kopyala</button>
      `;
      const btn = item.querySelector(".copy-btn");
      btn.addEventListener("click", async () => {
        await navigator.clipboard.writeText(fullUrl);
        btn.textContent = "Kopyalandı ✓";
        setTimeout(() => (btn.textContent = "Kopyala"), 1500);
      });
      endpointsEl.appendChild(item);
    });

    let lookupEntries = [];

    fetch("./v1/lookup.json")
      .then((r) => r.json())
      .then((data) => {
        lookupEntries = Object.entries(data);
        const boykotCount = lookupEntries.filter(([, v]) => v.status === "boykot").length;
        const degilCount = lookupEntries.length - boykotCount;
        document.getElementById("count-boykot").textContent = boykotCount;
        document.getElementById("count-degil").textContent = degilCount;
      });

    const input = document.getElementById("search-input");
    const clearBtn = document.getElementById("clear-btn");
    const resultsEl = document.getElementById("results");

    function renderResults() {
      const raw = input.value.trim();
      clearBtn.style.display = raw ? "block" : "none";
      const q = normalize(raw);
      resultsEl.innerHTML = "";

      if (!q) return;

      const matches = lookupEntries
        .filter(([key]) => key.includes(q))
        .sort(([a], [b]) => {
          if (a === q) return -1;
          if (b === q) return 1;
          if (a.startsWith(q) && !b.startsWith(q)) return -1;
          if (!a.startsWith(q) && b.startsWith(q)) return 1;
          return a.localeCompare(b);
        })
        .slice(0, 12);

      if (matches.length === 0) {
        resultsEl.innerHTML = `<div class="empty-msg">"${raw}" için listelerde kayıt bulunamadı.</div>`;
        return;
      }

      matches.forEach(([, item]) => {
        const isBoykot = item.status === "boykot";
        const div = document.createElement("div");
        div.className = "result-item";
        div.innerHTML = `
          <span class="result-name"></span>
          <span class="badge ${isBoykot ? "badge-boykot" : "badge-degil"}">
            ${isBoykot ? "Boykot" : "Boykot Değil"}
          </span>
        `;
        div.querySelector(".result-name").textContent = item.name;
        resultsEl.appendChild(div);
      });
    }

    input.addEventListener("input", renderResults);
    clearBtn.addEventListener("click", () => {
      input.value = "";
      renderResults();
      input.focus();
    });
  </script>
</body>
  </html>
